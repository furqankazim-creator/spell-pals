<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<link rel="icon" href="data:," />
<title>Spell Pals — Leo &amp; Bella</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{
    color-scheme: light;
    --ink:#3b2a1a; --dim:#7c6a58;
    --ring-amber:#fde68a; --ring-amber-soft:#fef3c7;
    --card:#ffffff;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Nunito",system-ui,sans-serif; color:var(--ink);
    background:linear-gradient(180deg,#7dd3fc 0%,#bae6fd 30%,#e0f2fe 62%,#fffbeb 100%);
    min-height:100vh;
  }
  body.night{background:linear-gradient(180deg,#1e1b4b 0%,#312e81 55%,#0f172a 100%); color:#f5f3ff;}
  body.night .dim, body.night .card-sub{color:#c4b5fd;}
  .font-display{font-family:"Baloo 2",system-ui,sans-serif;}
  .wrap{max-width:880px;margin:0 auto;padding:16px 16px 120px;position:relative;}
  .wrap.nopad-tab{padding-bottom:40px;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  button:focus-visible, input:focus-visible{outline:3px solid #f59e0b;outline-offset:2px;}

  /* ── home header ── */
  .toprow{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
  .profile-pill{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.92);border-radius:999px;padding:8px 20px 8px 8px;box-shadow:0 4px 14px rgba(59,42,26,.10);border:2px solid var(--ring-amber);}
  .avatar-circle{width:56px;height:56px;border-radius:50%;background:#fef3c7;display:flex;align-items:center;justify-content:center;font-size:30px;flex-shrink:0;}
  .profile-pill .pname{font-family:"Baloo 2";font-size:20px;font-weight:800;line-height:1.15;}
  .profile-pill .pstars{font-size:14px;font-weight:700;color:var(--dim);}
  .grown-btn{display:flex;align-items:center;gap:8px;min-height:64px;background:#fff;border-radius:999px;padding:8px 18px;font-family:"Baloo 2";font-size:18px;font-weight:700;box-shadow:0 4px 14px rgba(59,42,26,.10);border:2px solid var(--ring-amber);white-space:nowrap;flex-shrink:0;}
  @media(max-width:480px){.grown-btn{font-size:16px;padding:8px 14px;}.profile-pill{padding-right:14px;}.profile-pill .pname{font-size:18px;}}
  .grown-btn:active{transform:scale(.95);}

  .leo-card{margin-top:16px;background:#fff;border-radius:40px;padding:20px;text-align:center;box-shadow:0 8px 24px rgba(59,42,26,.10);border:2px solid var(--ring-amber);}
  body.night .leo-card{background:#312e81;border-color:#4c1d95;color:#f5f3ff;}
  .leo-card .leo-title{font-family:"Baloo 2";font-size:clamp(24px,4.5vw,30px);font-weight:800;margin:0;}
  .leo-card .leo-sub{font-weight:600;color:var(--dim);margin:4px 0 0;}
  body.night .leo-card .leo-sub{color:#c4b5fd;}

  .wotd-row{margin-top:16px;display:grid;grid-template-columns:1fr;gap:12px;}
  @media(min-width:640px){.wotd-row{grid-template-columns:3fr 2fr;}}
  .wotd-card{display:flex;align-items:center;gap:16px;background:#fff;border-radius:28px;padding:16px;box-shadow:0 4px 14px rgba(59,42,26,.08);border:2px solid #ddd6fe;}
  body.night .wotd-card{background:#312e81;border-color:#4c1d95;color:#f5f3ff;}
  .wotd-emoji{font-size:60px;line-height:1;}
  .wotd-label{font-family:"Baloo 2";font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:#8b5cf6;margin:0;}
  body.night .wotd-label{color:#c4b5fd;}
  .wotd-word{font-family:"Baloo 2";font-size:32px;font-weight:800;line-height:1.1;margin:0;}
  .wotd-btns{margin-top:6px;display:flex;gap:8px;flex-wrap:wrap;}
  .btn-hear{min-height:48px;border-radius:999px;background:#8b5cf6;color:#fff;padding:8px 16px;font-family:"Baloo 2";font-size:16px;font-weight:800;box-shadow:0 3px 8px rgba(139,92,246,.35);}
  .btn-spell{min-height:48px;border-radius:999px;background:#fbbf24;color:#fff;padding:8px 16px;font-family:"Baloo 2";font-size:16px;font-weight:800;box-shadow:0 3px 8px rgba(245,158,11,.35);}
  .btn-hear:active,.btn-spell:active{transform:scale(.95);}
  .goal-card{display:flex;align-items:center;gap:12px;background:#fff;border-radius:28px;padding:16px;box-shadow:0 4px 14px rgba(59,42,26,.08);border:2px solid #99f6e4;}
  body.night .goal-card{background:#312e81;border-color:#134e4a;color:#f5f3ff;}
  .goal-card .g-title{font-family:"Baloo 2";font-size:18px;font-weight:800;line-height:1.2;margin:0;}
  .goal-card .g-sub{font-size:14px;font-weight:700;color:var(--dim);margin:2px 0 0;}
  body.night .goal-card .g-sub{color:#c4b5fd;}

  .starwords-btn{margin-top:12px;display:flex;align-items:center;gap:16px;width:100%;min-height:84px;border-radius:28px;background:linear-gradient(90deg,#a78bfa,#e879f9);padding:16px;text-align:left;color:#fff;box-shadow:0 4px 14px rgba(139,92,246,.3);}
  .starwords-btn:active{transform:scale(.98);}
  .starwords-btn .sw-ico{width:64px;height:64px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:24px;background:rgba(255,255,255,.25);font-size:36px;}
  .starwords-btn .sw-name{font-family:"Baloo 2";font-size:24px;font-weight:800;line-height:1.15;display:block;}
  .starwords-btn .sw-sub{font-size:14px;font-weight:700;color:rgba(255,255,255,.85);display:block;}

  .games-grid{margin-top:20px;display:grid;grid-template-columns:1fr;gap:12px;}
  @media(min-width:640px){.games-grid{grid-template-columns:1fr 1fr;}}
  .game-card{display:flex;align-items:center;gap:16px;min-height:96px;border-radius:28px;background:#fff;padding:16px;text-align:left;box-shadow:0 4px 14px rgba(59,42,26,.08);border:2px solid #fef3c7;width:100%;}
  body.night .game-card{background:#312e81;border-color:#4c1d95;color:#f5f3ff;}
  .game-card:active{transform:scale(.98);}
  .game-tile{width:72px;height:72px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:24px;font-size:36px;}
  .game-name{font-family:"Baloo 2";font-size:24px;font-weight:800;line-height:1.15;display:block;}
  .game-skill{font-size:14px;font-weight:600;color:var(--dim);display:block;margin-top:2px;}
  body.night .game-skill{color:#c4b5fd;}
  .abc-tile{background:#38bdf8;color:#fff;font-family:"Baloo 2";font-weight:800;font-size:22px;border-radius:12px;padding:6px 10px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15);}
  .a-tile{background:#f43f5e;color:#fff;font-family:"Baloo 2";font-weight:800;font-size:30px;border-radius:12px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15);}
  .reward-card{background:linear-gradient(90deg,#fcd34d,#fdba74);border:none;}
  .reward-card .game-skill{color:rgba(120,53,15,.7);}
  .map-card{background:linear-gradient(90deg,#5eead4,#6ee7b7);border:none;}
  .map-card .game-skill{color:rgba(19,78,74,.7);}
  .story-card{background:linear-gradient(90deg,#c4b5fd,#d8b4fe);border:none;}
  @media(min-width:640px){.story-card{grid-column:span 2;}}
  .story-card .game-skill{color:rgba(76,29,149,.7);}
  .tile-light{background:rgba(255,255,255,.7)!important;}
  .home-foot{margin-top:24px;text-align:center;font-size:14px;font-weight:600;color:var(--dim);}

  /* ── tab bar ── */
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.96);border-top:4px solid var(--ring-amber);box-shadow:0 -4px 24px rgba(0,0,0,.08);padding-bottom:env(safe-area-inset-bottom);}
  .tabbar-inner{max-width:880px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);}
  .tab-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:72px;padding:4px 2px;}
  .tab-btn .t-ico{font-size:30px;line-height:1;}
  .tab-btn .t-lab{font-family:"Baloo 2";font-size:14px;font-weight:800;color:#7c6a58;}
  .tab-btn.on{background:#fef3c7;}
  .tab-btn.on .t-lab{color:#b45309;}
  .tab-btn:not(.on) .t-ico{opacity:.7;}

  /* ── generic screens ── */
  .screen-head{display:flex;align-items:center;gap:12px;}
  .screen-head h2{font-family:"Baloo 2";font-size:clamp(26px,5vw,36px);font-weight:800;margin:0;}
  .back-btn{width:64px;height:64px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:50%;background:#fff;font-size:28px;box-shadow:0 4px 12px rgba(59,42,26,.12);border:2px solid var(--ring-amber);}
  .back-btn:active{transform:scale(.95);}
  .dim{color:var(--dim);}
  .lead{font-size:18px;font-weight:600;color:var(--dim);margin-top:12px;}
  body.night .lead{color:#c4b5fd;}

  /* ── game screens ── */
  .game-head{display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .game-head .g-title{font-family:"Baloo 2";font-size:24px;font-weight:800;text-align:center;margin:0;}
  .round-dots{display:flex;justify-content:center;gap:4px;font-size:20px;margin-top:2px;}
  .round-dots .off{opacity:.3;filter:grayscale(1);}
  .avatar-mini{width:64px;height:64px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:50%;background:#fff;font-size:28px;box-shadow:0 4px 12px rgba(59,42,26,.12);border:2px solid var(--ring-amber);}
  .game-panel{margin-top:24px;border-radius:40px;background:rgba(255,251,235,.85);padding:32px 16px;box-shadow:inset 0 2px 10px rgba(59,42,26,.06);border:2px solid #fff;}
  body.night .game-panel{background:rgba(49,46,129,.85);border-color:#4c1d95;}
  @media(min-width:640px){.game-panel{padding:32px;}}
  .round-col{display:flex;flex-direction:column;align-items:center;gap:20px;}
  .pic-row{display:flex;align-items:center;gap:12px;}
  .pic-card{display:flex;flex-direction:column;align-items:center;background:#fff;border-radius:32px;padding:16px 24px;box-shadow:0 8px 20px rgba(59,42,26,.12);border:4px solid var(--ring-amber);}
  .pic-card .pic-emoji{font-size:7rem;line-height:1.1;}
  .pic-card.small .pic-emoji{font-size:5rem;}
  body.night .pic-card{color:var(--ink);}
  .speaker-btn{width:64px;height:64px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:#0ea5e9;color:#fff;font-size:28px;box-shadow:0 4px 12px rgba(14,165,233,.4);flex-shrink:0;}
  .speaker-btn:active{transform:scale(.95);}
  .round-prompt{font-family:"Baloo 2";font-size:20px;font-weight:700;color:var(--dim);text-align:center;margin:0;}
  body.night .round-prompt{color:#c4b5fd;}
  .round-prompt.big{font-size:24px;color:var(--ink);}
  body.night .round-prompt.big{color:#f5f3ff;}
  .slots-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
  @media(min-width:640px){.slots-row{gap:12px;}}
  .slot{font-family:"Baloo 2";display:flex;align-items:center;justify-content:center;border-radius:24px;font-weight:800;text-transform:uppercase;box-shadow:inset 0 2px 6px rgba(59,42,26,.12);width:64px;height:80px;font-size:36px;background:rgba(255,255,255,.8);border:2px solid var(--ring-amber);color:transparent;}
  .slot.filled{background:#fcd34d;color:var(--ink);}
  .slot.done{background:#2dd4bf;color:#fff;border-color:#2dd4bf;}
  .slot.hintslot{background:#fff;border:4px dashed #fda4af;color:#fda4af;}
  .slot.md{width:52px;height:72px;font-size:32px;}
  .slot.sm{width:44px;height:64px;font-size:28px;}
  .hint-pill{background:#ffe4e6;color:#e11d48;border-radius:999px;padding:8px 16px;font-family:"Baloo 2";font-size:18px;font-weight:700;margin:0;}
  .tiles-row{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;}
  .letter-tile{font-family:"Baloo 2";width:72px;height:72px;display:flex;align-items:center;justify-content:center;border-radius:24px;font-size:36px;font-weight:800;text-transform:uppercase;background:#fff;color:var(--ink);box-shadow:0 4px 10px rgba(59,42,26,.12);border:2px solid #fcd34d;}
  .letter-tile:active{transform:scale(.95);}
  .letter-tile.used{background:#fef3c7;color:#fde68a;opacity:.5;box-shadow:none;}
  .praise{font-family:"Baloo 2";font-size:30px;font-weight:700;color:#0d9488;text-align:center;margin:0;}
  body.night .praise{color:#5eead4;}
  .game-tip{margin-top:20px;text-align:center;font-family:"Baloo 2";font-size:18px;font-weight:700;color:var(--dim);}
  body.night .game-tip{color:#c4b5fd;}
  .choice-lg{font-family:"Baloo 2";width:96px;height:96px;display:flex;align-items:center;justify-content:center;border-radius:32px;background:#fff;font-size:60px;font-weight:800;text-transform:uppercase;box-shadow:0 8px 20px rgba(59,42,26,.12);border:4px solid #99f6e4;color:var(--ink);}
  .choice-lg:active{transform:scale(.95);}
  .sound-slot{font-family:"Baloo 2";display:flex;align-items:center;justify-content:center;border-radius:16px;font-weight:800;text-transform:uppercase;width:56px;height:64px;font-size:28px;background:rgba(255,255,255,.7);border:2px solid #ddd6fe;color:#ddd6fe;}
  .sound-slot.on{background:#a78bfa;color:#fff;border-color:#a78bfa;}
  .sound-piece{font-family:"Baloo 2";width:76px;height:76px;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:800;text-transform:uppercase;background:#fff;color:var(--ink);box-shadow:0 4px 10px rgba(59,42,26,.12);border:2px solid #c4b5fd;border-radius:22px 22px 22px 6px;}
  .sound-piece:active{transform:scale(.95);}
  .sound-piece.used{background:#ede9fe;color:#c4b5fd;opacity:.5;}
  .sounds-line{font-weight:600;color:var(--dim);margin:0;text-align:center;}
  body.night .sounds-line{color:#c4b5fd;}
  .match-word{background:#fff;border-radius:32px;padding:16px 32px;box-shadow:0 8px 20px rgba(59,42,26,.12);border:4px solid #fcd34d;color:var(--ink);}
  .match-word span{font-family:"Baloo 2";font-size:56px;font-weight:800;letter-spacing:.02em;}
  .match-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .match-opt{width:128px;height:128px;display:flex;align-items:center;justify-content:center;border-radius:32px;background:#fff;font-size:64px;box-shadow:0 8px 20px rgba(59,42,26,.12);border:4px solid var(--ring-amber);}
  @media(min-width:640px){.match-opt{width:144px;height:144px;}}
  .match-opt:active{transform:scale(.95);}
  .vowel-slot{font-family:"Baloo 2";display:flex;align-items:center;justify-content:center;border-radius:24px;font-weight:800;text-transform:uppercase;width:64px;height:80px;font-size:36px;background:#fff;box-shadow:0 2px 6px rgba(59,42,26,.08);border:2px solid var(--ring-amber);color:var(--ink);}
  .vowel-slot.missing{background:#e0f2fe;border:4px dashed #38bdf8;color:#38bdf8;}
  .vowel-slot.found{background:#38bdf8;color:#fff;border-color:#38bdf8;}
  .vowel-btn{font-family:"Baloo 2";width:72px;height:72px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:#fff;font-size:36px;font-weight:800;box-shadow:0 4px 10px rgba(59,42,26,.12);border:4px solid #bae6fd;color:var(--ink);}
  .vowel-btn:active{transform:scale(.95);}
  .rhyme-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;}
  .rhyme-opt{width:112px;height:128px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:32px;background:#fff;box-shadow:0 8px 20px rgba(59,42,26,.12);border:4px solid #fbcfe8;color:var(--ink);}
  @media(min-width:640px){.rhyme-opt{width:128px;}}
  .rhyme-opt .r-emoji{font-size:56px;line-height:1;}
  .rhyme-opt .r-word{font-family:"Baloo 2";font-size:20px;font-weight:800;}
  .rhyme-opt:active{transform:scale(.95);}
  @keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
  .wiggle{animation:wiggle .4s ease-in-out 2;border-color:#fda4af!important;}
  @media (prefers-reduced-motion: reduce){.wiggle{animation:none;}}

  /* ── memory ── */
  .memory-grid{margin-top:16px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  @media(min-width:640px){.memory-grid{grid-template-columns:repeat(4,1fr);}}
  .mem-card{position:relative;height:96px;display:flex;align-items:center;justify-content:center;border-radius:22px;box-shadow:0 4px 12px rgba(59,42,26,.12);}
  @media(min-width:640px){.mem-card{height:112px;}}
  .mem-card.hidden-card{background:linear-gradient(135deg,#22d3ee,#0ea5e9);color:#fff;font-family:"Baloo 2";font-size:36px;font-weight:800;}
  .mem-card.hidden-card:active{transform:scale(.95);}
  .mem-card.up{background:#fff;border:4px solid #67e8f9;color:var(--ink);}
  .mem-card.matched{background:#fff;border:4px solid #2dd4bf;color:var(--ink);}
  .mem-card .m-word{font-family:"Baloo 2";font-size:clamp(20px,4vw,28px);font-weight:800;padding:0 4px;text-align:center;}
  .mem-card .m-pic{font-size:52px;}
  .mem-check{position:absolute;right:6px;top:6px;width:28px;height:28px;border-radius:50%;background:#2dd4bf;color:#fff;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;}

  /* ── celebrate ── */
  .celebrate-col{display:flex;flex-direction:column;align-items:center;padding-top:24px;text-align:center;}
  .celebrate-col h2{font-family:"Baloo 2";font-size:48px;font-weight:800;margin:20px 0 0;}
  .stars-row{font-size:48px;margin-top:12px;}
  .stars-row .off{opacity:.3;filter:grayscale(1);}
  .celebrate-sub{font-size:18px;font-weight:700;color:var(--dim);margin-top:8px;max-width:520px;}
  body.night .celebrate-sub{color:#c4b5fd;}
  .sticker-new{margin-top:24px;background:#fff;border-radius:32px;padding:20px 32px;box-shadow:0 8px 20px rgba(59,42,26,.12);border:4px solid #fcd34d;color:var(--ink);}
  .sticker-new .sn-label{font-family:"Baloo 2";font-size:18px;font-weight:700;color:var(--dim);margin:0;}
  .sticker-new .sn-emoji{font-size:72px;margin:4px 0;}
  .sticker-new .sn-name{font-family:"Baloo 2";font-size:24px;font-weight:800;margin:0;}
  .big-btns{margin-top:32px;display:flex;flex-direction:column;gap:12px;width:100%;max-width:380px;}
  .big-btn{font-family:"Baloo 2";min-height:72px;border-radius:999px;font-size:24px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:12px 20px;}
  .big-btn:active{transform:scale(.98);}
  .btn-amber-grad{background:linear-gradient(90deg,#fbbf24,#fb923c);color:#fff;box-shadow:0 6px 16px rgba(245,158,11,.35);}
  .btn-white{background:#fff;box-shadow:0 4px 12px rgba(59,42,26,.1);border:2px solid var(--ring-amber);color:var(--ink);}
  .btn-teal{background:#2dd4bf;color:#fff;box-shadow:0 6px 16px rgba(45,212,191,.35);}
  .btn-violet-grad{background:linear-gradient(90deg,#a78bfa,#a855f7);color:#fff;box-shadow:0 6px 16px rgba(139,92,246,.35);}

  /* ── rewards / map / stories ── */
  .stickers-grid{margin-top:20px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  .sticker-cell{position:relative;display:flex;flex-direction:column;align-items:center;border-radius:28px;padding:20px 8px;box-shadow:0 4px 12px rgba(59,42,26,.08);}
  .sticker-cell.owned{background:#fff;border:4px solid #fcd34d;color:var(--ink);}
  .sticker-cell.locked{background:rgba(255,255,255,.5);border:2px solid #fff;}
  .sticker-cell .s-emoji{font-size:56px;}
  .sticker-cell.locked .s-emoji{opacity:.25;filter:grayscale(1);}
  .sticker-cell .s-name{font-family:"Baloo 2";margin-top:8px;text-align:center;font-size:16px;font-weight:700;line-height:1.2;}
  .sticker-cell.locked .s-name{color:var(--dim);}
  .sticker-count-badge{position:absolute;right:8px;top:8px;width:32px;height:32px;border-radius:50%;background:#fb7185;color:#fff;font-family:"Baloo 2";font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;}

    shuffle(fams).forEach(function(f){if(out.length>=n)return;var inL=f.filter(function(w){var e=byWord(w);return e&&e.l<=lvl;});var p=inL[Math.floor(Math.random()*inL.length)];var e=p?byWord(p):null;if(e&&!out.some(function(t){return t.w===e.w;}))out.push(e);});return out;}
  return pickWords(n,lvl);
}
function wordOfTheDay(){var d=new Date();var dayNum=Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/86400000);return WORDS[dayNum%WORDS.length];}
function vowelIndex(w){var i;for(i=1;i<w.length-1;i++)if(VOWELS.indexOf(w[i])>=0)return i;for(i=0;i<w.length;i++)if(VOWELS.indexOf(w[i])>=0)return i;return 1;}
function todaySeconds(){var t=new Date();t.setHours(0,0,0,0);return sessions.filter(function(s){return s.createdAt>=t.getTime();}).reduce(function(s,x){return s+x.durationSeconds;},0);}
function weekSeconds(){var t=Date.now()-7*86400000;return sessions.filter(function(s){return s.createdAt>=t;}).reduce(function(s,x){return s+x.durationSeconds;},0);}
function weekSessions(){var t=Date.now()-7*86400000;return sessions.filter(function(s){return s.createdAt>=t;}).length;}
function totalSeconds(){return sessions.reduce(function(s,x){return s+x.durationSeconds;},0);}
function sessionDays(){var set={},out=[];sessions.forEach(function(s){var d=new Date(s.createdAt);var k=d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();if(!set[k]){set[k]=1;out.push(k);}});return out;}
function playStreak(){var days={};sessionDays().forEach(function(k){days[k]=1;});function key(d){return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();}var d=new Date();if(!days[key(d)]){d.setDate(d.getDate()-1);if(!days[key(d)])return 0;}var n=0;while(days[key(d)]){n++;d.setDate(d.getDate()-1);}return n;}
function recordSession(gameType,dur,atts){
  sessions.push({id:Date.now()+"-"+Math.random(),gameType:gameType,durationSeconds:Math.max(1,dur),createdAt:Date.now()});
  atts.forEach(function(a){attempts.push({word:a.word,gameType:gameType,attempts:1,correct:a.correct?1:0});});
  var sticker=null;
  if(profile.rewardsOn){var owned={};stickers.forEach(function(s){owned[s.id]=1;});sticker=null;for(var i=0;i<STICKERS.length;i++){if(!owned[STICKERS[i].id]){sticker=STICKERS[i];break;}}if(!sticker)sticker=STICKERS[Math.floor(Math.random()*STICKERS.length)];stickers.push({id:sticker.id,emoji:sticker.emoji,label:sticker.label});}
  return sticker;
}

var AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;}}if(AC&&AC.state==="suspended")AC.resume();return AC;}
function tone(f,t0,dur,type,vol){if(!profile.soundOn)return;var ctx=ac();if(!ctx)return;var o=ctx.createOscillator(),g=ctx.createGain();o.type=type||"sine";o.frequency.value=f;var t=ctx.currentTime+t0;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.12,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+dur+0.05);}
function popSnd(){tone(620,0,0.09,"sine",0.08);}
function chime(){tone(660,0,0.16);tone(880,0.09,0.22);}
function nudgeSnd(){tone(220,0,0.15,"triangle",0.07);}
function fanfare(){tone(523,0,0.18);tone(659,0.12,0.18);tone(784,0.24,0.3);}
function speak(text){if(!profile.soundOn)return;try{if(!("speechSynthesis" in window))return;window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.rate=0.92;u.pitch=1.05;window.speechSynthesis.speak(u);}catch(e){}}

/* ================= game runner ================= */
var G=null; /* current game session */
function startGame(game,opts){
  opts=opts||{};
  var words;
  if(opts.singleWord){var e=byWord(opts.singleWord);words=e?[e]:pickGameWords(game,ROUNDS,maxLevel());}
  else if(opts.focus&&profile.focusWords.length){var pool=profile.focusWords.map(byWord).filter(Boolean);var sh=shuffle(pool);words=[];for(var i=0;i<ROUNDS;i++)words.push(sh[i%sh.length]);}
  else if(game==="memory"){startMemory();return;}
  else words=pickGameWords(game,ROUNDS,maxLevel());
  G={game:game,words:words,round:0,atts:[],start:Date.now(),roundState:null};
  screen={kind:"game"};
  render();
}
function roundDone(correct){
  if(!G)return;
  var cur=G.words[G.round];
  G.atts.push({word:cur.w,correct:!!correct});
  if(G.round+1<G.words.length){G.round++;G.roundState=null;render();return;}
  var cc=G.atts.filter(function(a){return a.correct;}).length;
  var game=G.game,total=G.words.length;
  recordSession(game,Math.round((Date.now()-G.start)/1000),G.atts);
  G=null;
  go({kind:"celebrate",game:game,correct:cc,total:total});
}
function praiseWord(){return PRAISE[Math.floor(Math.random()*PRAISE.length)];}

/* ---- Spell the Word ---- */
function spellRoundHTML(word){
  var letters=word.w.split("");
  var st=G.roundState;
  if(!st){
    var tiles=letters.map(function(ch,i){return{id:"l"+i,ch:ch};});
    if(letters.length===3){var pool="bcdfghjklmnpqrstvwxz".split("").filter(function(c){return letters.indexOf(c)<0;});tiles.push({id:"extra",ch:pool[Math.floor(Math.random()*pool.length)]||"z"});}
    st=G.roundState={tiles:shuffle(tiles),placed:letters.map(function(){return null;}),used:{},wrong:0,done:false,praise:praiseWord()};
    setTimeout(function(){speak(word.w);},350);
  }
  var cls=letters.length>=6?"sm":letters.length===5?"md":"";
  var hint=st.wrong>=2;
  var h='<div class="round-col"><div class="pic-row">'+picCard(word)+speakerBtn(word.w)+'</div><p class="round-prompt">Tap the letters to spell the word</p><div class="slots-row" role="group" aria-label="Spelling slots">';
  st.placed.forEach(function(ch,i){
    var c="slot "+cls+(st.done?" done":ch?" filled":(hint&&i===0?" hintslot":""));
    var label=ch?("Slot "+(i+1)+": "+ch+". Tap to remove"):("Empty slot "+(i+1));
    var txt=ch||(hint&&i===0?letters[0]:"·");
    h+='<button type="button" class="'+c+'" data-slot="'+i+'" aria-label="'+label+'">'+txt+"</button>";
  });
  h+="</div>";
  if(hint&&!st.done)h+='<p class="hint-pill">Psst — it starts with “'+letters[0].toUpperCase()+'”! 🦁</p>';
  if(st.done)h+='<p class="praise">'+st.praise+"</p>";
  else{h+='<div class="tiles-row" role="group" aria-label="Letter tiles">';
    st.tiles.forEach(function(t){h+='<button type="button" class="letter-tile'+(st.used[t.id]?" used":"")+'" data-tile="'+t.id+'" aria-label="Letter '+t.ch+'" '+(st.used[t.id]?"disabled":"")+">"+t.ch+"</button>";});
    h+="</div>";}
  return h+"</div>";
}
function spellPlace(tileId){
  var st=G.roundState,word=G.words[G.round];if(!st||st.done)return;
  var tile=null;st.tiles.forEach(function(t){if(t.id===tileId)tile=t;});if(!tile||st.used[tileId])return;
  var idx=st.placed.indexOf(null);if(idx<0)return;
  popSnd();speak(tile.ch);
  st.placed[idx]=tile.ch;st.used[tileId]=tileId;
  if(st.placed.every(function(v){return v!==null;})){
    if(st.placed.join("")===word.w){st.done=true;render();chime();speak(st.praise+" "+word.w+"!");setTimeout(function(){roundDone(st.wrong===0);},1600);return;}
    nudgeSnd();speak("Try again, you can do it!");st.wrong++;
    render();setTimeout(function(){if(G&&G.roundState===st){st.placed=word.w.split("").map(function(){return null;});st.used={};render();}},650);return;
  }
  render();
}
function spellRemove(i){
  var st=G.roundState;if(!st||st.done)return;var ch=st.placed[i];if(!ch)return;
  var cand=st.tiles.filter(function(t){return t.ch===ch&&st.used[t.id];});
  var before=0;for(var j=0;j<i;j++)if(st.placed[j]===ch)before++;
  var tile=cand[Math.min(before,cand.length-1)];st.placed[i]=null;if(tile)delete st.used[tile.id];render();
}

/* ---- Pick the Letter ---- */
function pickRoundHTML(word){
  var st=G.roundState;
  if(!st){var first=word.w[0];var others=shuffle(WORDS.filter(function(w){return w.w[0]!==first;}).map(function(w){return w.w[0];}));var dis=[];others.forEach(function(c){if(dis.indexOf(c)<0&&dis.length<2)dis.push(c);});st=G.roundState={choices:shuffle([first].concat(dis)),wrong:0,done:false,praise:praiseWord(),wrongPick:null};setTimeout(function(){speak(word.w+". What letter does "+word.w+" start with?");},350);}
  var h='<div class="round-col"><div class="pic-row">'+picCard(word)+speakerBtn(word.w)+'</div><p class="round-prompt big">“'+esc(word.w)+'” starts with…</p>';
  if(st.done)h+='<p class="praise">'+st.praise+"</p>";
  else{h+='<div class="tiles-row" role="group" aria-label="Letter choices">';
    st.choices.forEach(function(ch){h+='<button type="button" class="choice-lg'+(st.wrongPick===ch?" wiggle":"")+'" data-pick="'+ch+'" aria-label="Letter '+ch+'">'+ch+"</button>";});
    h+="</div>";}
  return h+"</div>";
}
function pickChoose(ch){
  var st=G.roundState,word=G.words[G.round];if(!st||st.done)return;
  if(ch===word.w[0]){st.done=true;render();chime();speak(st.praise+" "+word.w+" starts with "+ch+"!");setTimeout(function(){roundDone(st.wrong===0);},1600);}
  else{nudgeSnd();st.wrongPick=ch;st.wrong++;speak("Try again!");render();setTimeout(function(){if(G&&G.roundState===st){st.wrongPick=null;render();}},600);}
}

  if(!st){st=G.roundState={pieces:shuffle(word.w.split("").map(function(ch,i){return{id:i,ch:ch};})),next:0,wrong:0,done:false,praise:praiseWord(),wig:null};setTimeout(function(){speak("Let's sound out "+word.w);},350);}

  word.w.split("").forEach(function(ch,i){h+='<span class="sound-slot'+(i<st.next?" on":"")+'" style="'+sz+'">'+(i<st.next?ch:"?")+"</span>";});

    h+="</div>";}

function soundTap(id){
  var st=G.roundState,word=G.words[G.round];if(!st||st.done)return;id=parseInt(id,10);
  var piece=null;st.pieces.forEach(function(p){if(p.id===id)piece=p;});if(!piece||id<st.next)return;
  if(id===st.next){popSnd();speak(word.s[id]||piece.ch);st.next++;
    if(st.next===word.w.length){st.done=true;render();chime();setTimeout(function(){speak(word.w+"! "+st.praise);},500);setTimeout(function(){roundDone(st.wrong===0);},1900);return;}
    render();}
  else{nudgeSnd();st.wrong++;st.wig=id;render();setTimeout(function(){if(G&&G.roundState===st){st.wig=null;render();}},450);}
}

/* ---- Rhyme Time ---- */
function rhymeRoundHTML(word){
  var st=G.roundState;
  if(!st){var fam=RHYME_FAMILIES.filter(function(f){return f.indexOf(word.w)>=0;})[0]||[word.w];
    var answerName=shuffle(fam.filter(function(w){return w!==word.w;}))[0]||word.w;
    var others=shuffle(WORDS.filter(function(w){return fam.indexOf(w.w)<0&&Math.abs(w.w.length-word.w.length)<=1;})).slice(0,2);
    var ans=byWord(answerName)||word;
    st=G.roundState={family:fam,options:shuffle([ans].concat(others)),wrong:0,done:false,praise:praiseWord(),wrongId:null};

var M=null;
function startMemory(){
  var pairWords=pickWords(6,maxLevel());
  var cards=shuffle(pairWords.reduce(function(acc,w){acc.push({key:w.w+"-w",word:w,face:"word"});acc.push({key:w.w+"-p",word:w,face:"pic"});return acc;},[]));
  M={pairWords:pairWords,cards:cards,flipped:[],matched:{},busy:false,misses:{},start:Date.now()};
  screen={kind:"memory"};render();
}
function memoryFinish(){
  var atts=M.pairWords.map(function(w){return{word:w.w,correct:!(M.misses[w.w]>0)};});
  var cc=atts.filter(function(a){return a.correct;}).length,total=M.pairWords.length;
  recordSession("memory",Math.round((Date.now()-M.start)/1000),atts);
  M=null;go({kind:"celebrate",game:"memory",correct:cc,total:total});
}
function memoryFlip(key){
  if(!M||M.busy)return;
  var card=null;M.cards.forEach(function(c){if(c.key===key)card=c;});if(!card)return;
  if(M.flipped.indexOf(key)>=0||M.matched[card.word.w])return;
  popSnd();M.flipped.push(key);
  if(M.flipped.length<2){render();return;}
  var a=null,b=null;M.cards.forEach(function(c){if(c.key===M.flipped[0])a=c;if(c.key===M.flipped[1])b=c;});
  if(!a||!b){M.flipped=[];render();return;}
  if(a.word.w===b.word.w){chime();speak(a.word.w+"! You found a pair!");M.matched[a.word.w]=1;M.flipped=[];render();
    if(Object.keys(M.matched).length===M.pairWords.length)setTimeout(memoryFinish,900);}
  else{nudgeSnd();[a.word.w,b.word.w].forEach(function(w){M.misses[w]=(M.misses[w]||0)+1;});M.busy=true;render();
    setTimeout(function(){if(M){M.flipped=[];M.busy=false;render();}},1000);}
}
function memoryHTML(){
  var h=gameHead("memory",0,0).replace("🧠 Memory Match","🧠 Memory Match");

  h+='<p class="round-prompt" style="margin-top:8px;text-align:center">Pairs found: '+Object.keys(M.matched).length+" of "+M.pairWords.length+'</p><p class="round-prompt" style="margin-top:16px;text-align:center">Flip two cards — match the word with its picture!</p><div class="memory-grid" role="group" aria-label="Memory cards">';
  M.cards.forEach(function(card){
    var isUp=M.flipped.indexOf(card.key)>=0||!!M.matched[card.word.w];
    var matched=!!M.matched[card.word.w];
    if(isUp){h+='<button type="button" class="mem-card '+(matched?"matched":"up")+'" data-mem="'+card.key+'" '+(matched?"disabled":"")+' aria-label="'+(card.face==="word"?("Word card: "+card.word.w):("Picture card: "+card.word.w))+'">'+(card.face==="word"?('<span class="m-word">'+esc(card.word.w)+"</span>"):('<span class="m-pic" role="img" aria-hidden="true">'+card.word.e+"</span>"))+(matched?'<span class="mem-check" aria-hidden="true">✓</span>':"")+"</button>";}

  return shell(h,false);
}

    +toggle("Sticker rewards","Turn off for a calmer game with no reward box prizes","rewardsOn")
    +toggle("Bedtime mode","A calm, starry night sky across the children's screens — lovely for evening stories","bedtimeMode")
    +'</div><div style="margin-top:16px"><span class="field-label" id="goal-label">Daily play goal</span><p class="tg-hint" style="font-size:14px;font-weight:600;color:var(--dim);margin:0">Shown as a friendly ring on the home screen — a goal, never a limit.</p><div class="goal-btns" role="group" aria-labelledby="goal-label">';
  [5,10,15,20].forEach(function(m){h+='<button type="button" class="goal-opt'+(profile.dailyGoal===m?" sel":"")+'" data-goal="'+m+'" aria-pressed="'+(profile.dailyGoal===m)+'" aria-label="Daily goal '+m+' minutes">'+m+" min</button>";});
  h+='</div></div><div class="form-grid"><div><label class="field-label" for="edit-name">Child\'s name</label><div class="field-row"><input id="edit-name" class="field-input" value="'+esc(nameDraft)+'" maxlength="30" /><button type="button" class="field-save" data-savename="1" aria-label="Save name">Save</button></div></div>'
    +'<div><label class="field-label" for="new-pin">Change PIN</label><div class="field-row"><input id="new-pin" class="field-input pin-input" value="'+esc(newPinDraft)+'" placeholder="4 numbers" inputmode="numeric" autocomplete="off" /><button type="button" class="field-save" data-savepin="1" aria-label="Save new PIN">Save</button></div>'+(pinMsg?'<p class="field-msg" role="status">'+esc(pinMsg)+"</p>":"")+"</div></div>";
  h+='<div style="margin-top:16px"><span class="field-label">Play buddy face</span><div class="avatar-row" role="group" aria-label="Play buddy face">';
  AVATARS.forEach(function(a){h+='<button type="button" class="avatar-opt'+(profile.avatar===a?" sel":"")+'" data-avatar="'+a+'" aria-pressed="'+(profile.avatar===a)+'" aria-label="Buddy '+a+'">'+a+"</button>";});
  h+='</div></div><div class="danger-zone">';
  if(confirmReset)h+='<div class="reset-confirm"><p>Clear all progress, sessions and stickers?</p><button type="button" class="btn-danger" data-reset="2">Yes, clear it</button><button type="button" class="btn-keep" data-reset="0">Keep it</button></div>';
  else h+='<button type="button" class="btn-danger-soft" data-reset="1">Start fresh — clear all progress</button>';
  h+="</div></section>";
  h+='<p class="parent-foot">Spell Pals keeps only your child\'s name, age and play progress, in this app on this visit. No ads, no purchases, no external links.</p>';
  document.body.classList.remove("night");
  return '<div class="parent-wrap"><div class="parent-inner">'+h+"</div></div>";
}

/* ================= render & events ================= */
function render(){
  var app=$("app");var html="";
  if(screen.kind==="home")html=homeHTML();
  else if(screen.kind==="game"&&G)html=gameHTML();
  else if(screen.kind==="memory"&&M)html=memoryHTML();
  else if(screen.kind==="celebrate")html=celebrateHTML();
  else if(screen.kind==="rewards")html=rewardsHTML();
  else if(screen.kind==="map")html=mapHTML();
  else if(screen.kind==="stories")html=storiesHTML();
  else if(screen.kind==="story")html=storyHTML();
  else if(screen.kind==="pin")html=parentUnlocked?parentHTML():pinHTML();
  else if(screen.kind==="parent")html=parentHTML();
  else html=homeHTML();
  app.innerHTML=html;
  if(screen.kind!=="parent"&&screen.kind!=="pin")document.body.classList.toggle("night",!!profile.bedtimeMode);
  if(screen.kind==="pin"&&parentUnlocked)document.body.classList.remove("night");
  setTabbar();
}
document.addEventListener("click",function(ev){
  var el=ev.target.closest("[data-go],[data-game],[data-speak],[data-wotd],[data-focus],[data-tile],[data-slot],[data-pick],[data-piece],[data-match],[data-vowel],[data-rhyme],[data-mem],[data-again],[data-story],[data-storyagain],[data-page],[data-pin],[data-toggle],[data-goal],[data-avatar],[data-reset],[data-focuspick],[data-focusremove],[data-focussave],[data-savename],[data-savepin]");
  if(!el)return;
  if(el.hasAttribute("data-speak")){speak(el.getAttribute("data-speak"));return;}
  if(el.hasAttribute("data-go")){var k=el.getAttribute("data-go");G=null;if(k!=="home"&&k!=="pin")M=null;go({kind:k});return;}
  if(el.hasAttribute("data-game")){popSnd();var g=el.getAttribute("data-game");if(g==="memory")startMemory();else startGame(g);return;}
  if(el.hasAttribute("data-wotd")){popSnd();startGame("spell",{singleWord:wordOfTheDay().w});return;}
  if(el.hasAttribute("data-focus")){popSnd();startGame("spell",{focus:true});return;}
  if(el.hasAttribute("data-tile")){spellPlace(el.getAttribute("data-tile"));return;}
  if(el.hasAttribute("data-slot")){spellRemove(parseInt(el.getAttribute("data-slot"),10));return;}
  if(el.hasAttribute("data-pick")){pickChoose(el.getAttribute("data-pick"));return;}
  if(el.hasAttribute("data-piece")){soundTap(el.getAttribute("data-piece"));return;}
  if(el.hasAttribute("data-match")){matchChoose(el.getAttribute("data-match"));return;}
  if(el.hasAttribute("data-vowel")){vowelChoose(el.getAttribute("data-vowel"));return;}
  if(el.hasAttribute("data-rhyme")){rhymeChoose(el.getAttribute("data-rhyme"));return;}
  if(el.hasAttribute("data-mem")){memoryFlip(el.getAttribute("data-mem"));return;}
  if(el.hasAttribute("data-again")){var ag=el.getAttribute("data-again");if(ag==="memory")startMemory();else startGame(ag);return;}
  if(el.hasAttribute("data-story")){popSnd();storyPage=0;storyStart=Date.now();storyRecorded=false;go({kind:"story",id:el.getAttribute("data-story")});return;}
  if(el.hasAttribute("data-storyagain")){storyPage=0;storyStart=Date.now();storyRecorded=true;render();window.scrollTo(0,0);return;}
  if(el.hasAttribute("data-page")){popSnd();storyPage+=parseInt(el.getAttribute("data-page"),10);render();window.scrollTo(0,0);return;}
  if(el.hasAttribute("data-pin")){pinPress(el.getAttribute("data-pin"));return;}
  if(el.hasAttribute("data-toggle")){var key=el.getAttribute("data-toggle");var ni=$("edit-name");if(ni)nameDraft=ni.value;var np=$("new-pin");if(np)newPinDraft=np.value;profile[key]=!profile[key];render();return;}
  if(el.hasAttribute("data-goal")){var ni2=$("edit-name");if(ni2)nameDraft=ni2.value;profile.dailyGoal=parseInt(el.getAttribute("data-goal"),10);render();return;}
  if(el.hasAttribute("data-avatar")){profile.avatar=el.getAttribute("data-avatar");render();return;}
  if(el.hasAttribute("data-focuspick")){var w=el.getAttribute("data-focuspick");var i=focusSel.indexOf(w);if(i>=0)focusSel.splice(i,1);else if(focusSel.length<8)focusSel.push(w);focusMsg="";render();return;}
  if(el.hasAttribute("data-focusremove")){var w2=el.getAttribute("data-focusremove");focusSel=focusSel.filter(function(x){return x!==w2;});focusMsg="";render();return;}
  if(el.hasAttribute("data-focussave")){profile.focusWords=focusSel.slice();focusMsg="Star Words saved ✓";render();return;}
  if(el.hasAttribute("data-savename")){var inp=$("edit-name");if(inp&&inp.value.trim()){profile.name=inp.value.trim();nameDraft=profile.name;}render();return;}
  if(el.hasAttribute("data-savepin")){var pinInp=$("new-pin");var v=pinInp?pinInp.value.replace(/\D/g,"").slice(0,4):"";if(/^\d{4}$/.test(v)){profile.pin=v;newPinDraft="";pinMsg="PIN updated ✓";}else pinMsg="PIN needs exactly 4 numbers.";render();return;}
  if(el.hasAttribute("data-reset")){var r=el.getAttribute("data-reset");if(r==="1"){confirmReset=true;render();}else if(r==="0"){confirmReset=false;render();}else{attempts=[];sessions=[];stickers=[];confirmReset=false;focusSel=[];profile.focusWords=[];render();}return;}
});
document.addEventListener("input",function(ev){
  if(ev.target.id==="edit-name")nameDraft=ev.target.value;
  if(ev.target.id==="new-pin"){newPinDraft=ev.target.value.replace(/\D/g,"").slice(0,4);if(ev.target.value!==newPinDraft)ev.target.value=newPinDraft;pinMsg="";}
});
</script>
